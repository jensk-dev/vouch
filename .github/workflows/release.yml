name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches mod_version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and test
        run: ./gradlew build runGameTest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --verify-tag --generate-notes
