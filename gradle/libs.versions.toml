[versions]
# Not updatable by Dependabot: com.mojang:minecraft is synthesized locally by Loom.
# Bump manually together with fabric-api and the "minecraft" constraint in fabric.mod.json.
minecraft = "26.2"
loom = "1.17.20"
fabric-loader = "0.19.5"
loader-junit = "0.19.5"
fabric-api = "0.159.2+"
permissions-api = "0.7.0"
sqlite-jdbc = "3.53.4.0"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-permissions-api = { module = "me.lucko:fabric-permissions-api", version.ref = "permissions-api" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
loader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "loader-junit" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
